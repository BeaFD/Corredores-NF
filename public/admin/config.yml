backend:
  name: github
  repo: beafd/corredores-nf # <-- Change this!
  branch: master

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "blog"
    label: "Blog"
    folder: "posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "inicio"
    label: "Inicio Section"
    files:
      - label: "Inicio"
        name: "inicio"
        file: "content/inicio.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Text", name: "text", widget: "markdown" }

  - name: "nosotros"
    label: "Nosotros Section"
    files:
      - label: "Nosotros"
        name: "nosotros"
        file: "content/nosotros.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Text", name: "text", widget: "markdown" }

  # Repeat for Personas, Empresas, Preguntas, Contacto, Header, etc.